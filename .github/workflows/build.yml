name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk controle-tv.apk
      # Publica o APK num repositório PÚBLICO só de versões, para o app conseguir
      # verificar e baixar atualizações sem login (este repositório é privado).
      - uses: softprops/action-gh-release@v2
        with:
          repository: Rafajames/controle-tv-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          files: controle-tv.apk
          make_latest: true
